<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文字麻将</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#3E7B57; --felt-2:#336A4A; --felt-ink:#EEF4EC; --felt-dim:#BCD4C2; --felt-line:rgba(255,255,255,.16);
  --panel:#EFE9DA; --panel-ink:#1E231F; --panel-dim:#6C6A60; --taupe:#B3AC99;
  --tile:#FBF8EE; --tile-2:#E9E1CB; --tile-back:#2D6446; --ink:#151715;
  --seal:#B3362A; --seal-ink:#FFF3EC; --gold:#E2BE63;
  --brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --felt:#224A36; --felt-2:#1B3D2C; --felt-dim:#93B39D;
    --panel:#2B302C; --panel-ink:#EDE8DB; --panel-dim:#A6A193; --taupe:#5D594F;
  }
}
:root[data-theme="dark"]{
  --felt:#224A36; --felt-2:#1B3D2C; --felt-dim:#93B39D;
  --panel:#2B302C; --panel-ink:#EDE8DB; --panel-dim:#A6A193; --taupe:#5D594F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;
  background:radial-gradient(120% 80% at 50% 30%, var(--felt) 0%, var(--felt-2) 100%) fixed, var(--felt);
  color:var(--felt-ink); font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 24px}

/* ---------- tiles ---------- */
.tile{
  --tw:40px;
  width:var(--tw); height:calc(var(--tw)*1.3);
  display:inline-flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,var(--tile) 0%,var(--tile-2) 100%);
  border-radius:calc(var(--tw)*.14);
  box-shadow:0 calc(var(--tw)*.08) 0 var(--tile-back), 0 calc(var(--tw)*.1) calc(var(--tw)*.14) rgba(0,0,0,.28);
  font-family:var(--brush); color:var(--ink); font-size:calc(var(--tw)*.7); line-height:1;
  border:0; padding:0; flex:none; user-select:none; position:relative;
  transition:transform .12s ease;
}
.tile.sm{--tw:24px}
.tile.md{--tw:34px}
.tile.lg{--tw:clamp(34px,10vw,54px)}
.tile.hand{--tw:clamp(31px,8.8vw,50px)}
.tile.sel{transform:translateY(-10px)}
.tile.new::after{content:"";position:absolute;top:-6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold)}
.tile.hot{box-shadow:0 0 0 2px var(--seal),0 calc(var(--tw)*.08) 0 var(--tile-back)}
.tile.back{background:var(--tile-back);box-shadow:0 2px 0 #1d4630}
.tiles{display:flex;flex-wrap:wrap;gap:6px 4px}
.sentence{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 4px}
.brk{width:10px;align-self:stretch;display:flex;align-items:flex-end;justify-content:center;font-family:var(--brush);color:var(--gold);font-size:22px;line-height:1}

/* ---------- common ---------- */
h1{font-family:var(--brush);font-weight:400;margin:0;line-height:1.05}
.btn{
  border:0;border-radius:10px;padding:11px 18px;font-weight:600;
  background:var(--panel);color:var(--panel-ink);
  box-shadow:0 3px 0 rgba(0,0,0,.22);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.primary{background:var(--gold);color:#2A220C}
.btn.seal{background:var(--seal);color:var(--seal-ink)}
.btn.ghost{background:transparent;color:var(--felt-ink);box-shadow:inset 0 0 0 1.5px var(--felt-line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{padding:7px 12px;font-size:13px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--felt-dim)}
.card{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:16px}
.card .muted{color:var(--panel-dim)}
input.text{
  width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--taupe);
  background:var(--tile);color:var(--ink);
}

/* ---------- home ---------- */
.hero{padding:28px 0 18px;display:grid;gap:14px}
.hero-title{display:flex;gap:6px;align-items:flex-end}
.hero-title .tile{--tw:clamp(52px,16vw,84px)}
.hero p{margin:0;max-width:34em;color:var(--felt-dim)}
.rooms{display:grid;gap:10px;margin-top:10px}
.room-item{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.14);border-radius:12px;padding:12px 14px}
.room-item .grow{flex:1;min-width:0}
.room-item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rules{margin-top:22px;background:rgba(0,0,0,.14);border-radius:12px;padding:12px 14px}
details.rules summary{cursor:pointer;font-weight:600}
details.rules ol{margin:10px 0 0;padding-left:1.3em;color:var(--felt-dim)}
details.rules li{margin:4px 0}

/* ---------- table ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topbar .grow{flex:1;min-width:0}
.topbar h1{font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seat{flex:none;min-width:92px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.16);position:relative}
.seat.turn{background:var(--panel);color:var(--panel-ink)}
.seat.turn .muted{color:var(--panel-dim)}
.seat .nm{font-weight:600;font-size:14px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.seat .meta{font-size:12px}
.badge{display:inline-block;font-size:11px;padding:0 5px;border-radius:4px;background:var(--seal);color:var(--seal-ink);margin-left:4px;vertical-align:1px}
.badge.gold{background:var(--gold);color:#2A220C}
.status{font-family:var(--brush);font-size:clamp(22px,6vw,30px);margin:16px 0 6px;line-height:1.2}
.pile-list{display:grid;gap:10px;margin-top:10px}
.pile{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start}
.pile .who{font-size:13px;color:var(--felt-dim);padding-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wins{display:grid;gap:10px;margin-top:18px}
.win{background:rgba(0,0,0,.16);border-radius:12px;padding:10px 12px}
.win .head{font-size:13px;color:var(--felt-dim);margin-bottom:8px}
.log{margin-top:18px;font-size:13px;color:var(--felt-dim);display:grid;gap:2px}
.dock{
  position:sticky;bottom:0;margin:22px -14px 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,.28) 18px),var(--felt-2);
  border-top:1px solid var(--felt-line);
}
.dock .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dock .hand{padding-top:10px}
.hint{font-size:13px;color:var(--felt-dim);margin-bottom:8px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:env(safe-area-inset-top,0px) 0 0}
.sheet{width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--felt);border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet h2{font-family:var(--brush);font-weight:400;font-size:28px;margin:0 0 4px}
.compose-area{min-height:130px;background:rgba(0,0,0,.18);border-radius:12px;padding:14px 10px;margin:12px 0}
.compose-area.empty{display:flex;align-items:center;justify-content:center;color:var(--felt-dim);font-size:14px}
.tally{display:flex;gap:16px;font-size:14px;margin:12px 0}
.center{text-align:center}
.stamp{
  width:112px;height:112px;margin:6px auto 14px;border-radius:14px;background:var(--seal);color:var(--seal-ink);
  font-family:var(--brush);font-size:84px;line-height:112px;text-align:center;
  box-shadow:inset 0 0 0 5px var(--seal),inset 0 0 0 8px var(--seal-ink);
  animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp.fail{background:transparent;color:var(--felt-dim);box-shadow:inset 0 0 0 3px var(--felt-dim);font-size:44px}
@keyframes stamp{from{transform:scale(1.9) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none;transform:rotate(-6deg)}.tile{transition:none}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;
  background:var(--panel);color:var(--panel-ink);padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);
  font-size:14px;max-width:90vw;display:none}
.toast.on{display:block}
.rank{display:grid;gap:12px;margin-top:12px}

.net{background:rgba(0,0,0,.22);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.share{background:rgba(0,0,0,.14);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.off{font-size:11px;color:var(--gold)}
.btn.ghost-dark{background:transparent;color:var(--panel-ink);box-shadow:inset 0 0 0 1.5px var(--taupe)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const TILE_STR="吃点黑白呆比很爱野火天眼快大的被傻醒喜说钱之好但无影西瓜可生坏梦红王后那里又没少喝要麻烟地吧纯热着对谁去欢乐只在痛东海春哪把中风来气笑心不老失明为饱给有神人你将活到小色鬼都狂哭她们发疯恋日语和别个就迷得啊我多听冷月儿空跑花美过吗它丑乱敌手做夏菜一看像是几子睡死极光如飞电他饿了这酒家想完杀";
const TILES=[...TILE_STR];
const DICE="⚀⚁⚂⚃⚄⚅";
const PREFIX="wzmj-v1-";
const ICE={iceServers:[
  {urls:"stun:stun.miwifi.com:3478"},
  {urls:"stun:stun.chat.bilibili.com:3478"},
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:"stun:stun.l.google.com:19302"},
]};
const $app=document.getElementById("app");

/* ---------- utils ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
function rid(n=6,a="abcdefghjkmnpqrstuvwxyz23456789"){let s="";for(let i=0;i<n;i++)s+=a[rnd(a.length)];return s}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const d6=()=>1+rnd(6);
const clone=o=>JSON.parse(JSON.stringify(o));
let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2800)}
function need(c,msg){if(!c)throw msg}
function merge(a,b){for(const k in b){const v=b[k];
  if(v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))merge(a[k],v);
  else a[k]=v===undefined?undefined:clone(v)}return a}

let myUid=lsGet("wzmj:uid");if(!myUid){myUid=rid(10);lsSet("wzmj:uid",myUid)}
const S={phase:"home",me:myUid,name:lsGet("wzmj:name")||"",code:null,isHost:false,room:null,
  sel:null,order:[],newTile:null,comp:null,seen:new Set(),banner:null,busy:false,firstSnap:true,netMsg:""};

/* ---------- game helpers ---------- */
const plist=s=>Object.entries(s.players||{}).filter(([,v])=>v).map(([k,v])=>({id:k,...v})).sort((a,b)=>a.at-b.at);
const nm=(s,u)=>(s.players&&s.players[u]&&s.players[u].name)||"某人";
const isDone=(s,u,extra)=>!!(s.done&&s.done[u])||u===extra;
function nextActive(s,u,extra){const seats=s.seats||[];const i=seats.indexOf(u);
  for(let k=1;k<=seats.length;k++){const x=seats[(i+k)%seats.length];if(!isDone(s,x,extra))return x}return null}
function logP(s,p,...lines){p.log=[...(s.log||[]),...lines].slice(-40);return p}
function cleanSeq(seq){const out=[];for(const x of seq){if(x<0){if(out.length&&out[out.length-1]>=0)out.push(-1)}else out.push(x)}
  while(out.length&&out[out.length-1]<0)out.pop();return out}
const seqText=seq=>seq.map(x=>x<0?"，":TILES[x]).join("");

/* ---------- patches: run on the host, with ME = acting player ---------- */
let ME=null,MENAME="";
function joinPatch(s){
  const name=String(MENAME||"").trim().slice(0,12);need(name,"先起一个昵称");
  if(s.players&&s.players[ME])return {players:{[ME]:{name,at:s.players[ME].at}}};
  need(s.status==="lobby","这桌已经开局了，可以先围观");
  need(plist(s).length<6,"这桌已满 6 人");
  return logP(s,{players:{[ME]:{name,at:Date.now()}}},`${name} 入座`);
}
function leavePatch(s){
  need(s.host!==ME,"房主不能离座");
  if(s.status!=="lobby"||!s.players||!s.players[ME])return null;
  return logP(s,{players:{[ME]:null}},`${nm(s,ME)} 离座`);
}
function startPatch(s){
  need(s.host===ME,"只有房主可以开局");
  const fresh=s.status==="lobby";
  const ps=fresh?plist(s).map(p=>p.id):[...s.seats];
  need(ps.length>=2,"至少需要 2 位玩家");need(ps.length<=6,"最多 6 位玩家");

    for(let t=0;t<300;t++){dice={};ps.forEach(u=>dice[u]=[d6(),d6()]);
      const sums=ps.map(u=>dice[u][0]+dice[u][1]);if(new Set(sums).size===sums.length)break}
    seats=[...ps].sort((a,b)=>(dice[b][0]+dice[b][1])-(dice[a][0]+dice[a][1]));
    dealer=seats[0];
    seats.forEach(u=>lines.push(`${nm(s,u)} 掷出 ${DICE[dice[u][0]-1]}${DICE[dice[u][1]-1]}，${dice[u][0]+dice[u][1]} 点`));
    lines.push(`按点数顺时针落座，${nm(s,dealer)} 坐庄`);
  }else{

    lines.push(`第 ${(s.round||0)+1} 局开始，${nm(s,dealer)} 坐庄`);
  }
  const wall=shuffle([...Array(TILES.length).keys()]);
  const hands={},discards={},done={};
  seats.forEach(u=>{hands[u]=[];discards[u]=[];done[u]=null});
  const di=seats.indexOf(dealer);
  for(let r=0;r<13;r++)for(let k=0;k<seats.length;k++)hands[seats[(di+k)%seats.length]].push(wall.pop());
  return logP(s,{status:"playing",seats,dice,dealer,round:(s.round||0)+1,wall,hands,discards,done,
    last:null,turn:dealer,stage:"draw",pending:null,firstWinner:null,lastResult:null,endReason:null},...lines);
}
const turnOf=(s,u,stage)=>s.status==="playing"&&!s.pending&&s.turn===u&&s.stage===stage;
function drawPatch(s){
  need(turnOf(s,ME,"draw"),"现在不能摸牌");
  if(!s.wall.length)return logP(s,{status:"ended",endReason:"wall",pending:null},"牌堆摸完了，本局结束");
  const wall=[...s.wall];const t=wall.pop();
  return logP(s,{wall,hands:{[ME]:[...s.hands[ME],t]},stage:"discard",last:null},`${nm(s,ME)} 摸了一张牌`);
}
function chiPatch(s){
  need(turnOf(s,ME,"draw")&&s.last&&s.last.from!==ME,"现在不能吃牌");
  const {tile,from}=s.last;const pile=[...(s.discards[from]||[])];const i=pile.lastIndexOf(tile);if(i>=0)pile.splice(i,1);
  return logP(s,{hands:{[ME]:[...s.hands[ME],tile]},discards:{[from]:pile},last:null,stage:"discard"},`${nm(s,ME)} 吃了「${TILES[tile]}」`);
}
function discardPatch(s,t){
  need(turnOf(s,ME,"discard"),"现在不能出牌");
  const hand=s.hands[ME];need(hand.includes(t),"这张牌不在你手里");
  const nt=nextActive(s,ME)||ME;
  return logP(s,{hands:{[ME]:hand.filter(x=>x!==t)},discards:{[ME]:[...(s.discards[ME]||[]),t]},
    last:{tile:t,from:ME,id:rid(5)},turn:nt,stage:"draw"},`${nm(s,ME)} 打出「${TILES[t]}」`);
}
function huPatch(s,comp){
  need(comp&&Array.isArray(comp.seq),"句子格式不对");
  need(s.status==="playing"&&!s.pending,"有人正在等投票，稍后再胡");
  need((s.seats||[]).includes(ME)&&!(s.done&&s.done[ME]),"你这局已经胡过了");
  let expect;
  if(comp.source==="self"){need(s.turn===ME&&s.stage==="discard","轮到你出牌时才能自摸胡");expect=[...s.hands[ME]]}
  else{need(s.stage==="draw"&&s.last&&s.last.from!==ME&&s.last.id===comp.lastId,"这张牌已经不能胡了");expect=[...s.hands[ME],s.last.tile]}
  const seq=cleanSeq(comp.seq.map(Number));const used=seq.filter(x=>x>=0);
  need(used.length===expect.length&&new Set(used).size===used.length&&used.every(x=>expect.includes(x)),"要用上全部手牌");
  const p={id:rid(6),uid:ME,seq,source:comp.source==="self"?"self":"discard",votes:{}};
  if(p.source==="discard"){p.tile=s.last.tile;p.from=s.last.from}
  return logP(s,{pending:p},`${nm(s,ME)} 宣告胡牌：「${seqText(seq)}」`);
}
function votePatch(s,pid,v){
  const p=s.pending;need(p&&p.id===pid,"这轮投票已经结束");
  need(p.uid!==ME&&(s.seats||[]).includes(ME),"你不能投这一票");
  v=v==="y"?"y":"n";
  const votes={...(p.votes||{}),[ME]:v};
  const voters=s.seats.filter(u=>u!==p.uid);
  if(voters.every(u=>votes[u]))return resolvePatch(s,votes);
  return {pending:{votes:{[ME]:v}}};
}
function forcePatch(s,pid){
  need(s.host===ME,"只有房主可以结算");
  need(s.pending&&s.pending.id===pid,"这轮投票已经结束");
  return resolvePatch(s,s.pending.votes||{});
}
function resolvePatch(s,votes){
  const p=s.pending;const vals=Object.entries(votes).filter(([u])=>u!==p.uid).map(([,v])=>v);
  const y=vals.filter(v=>v==="y").length,n=vals.filter(v=>v==="n").length;const ok=y>n;
  const patch={pending:null,lastResult:{id:p.id,uid:p.uid,ok,y,n,seq:p.seq,source:p.source}};
  const who=nm(s,p.uid);
  if(ok){
    const rank=Object.values(s.done||{}).filter(Boolean).length+1;
    patch.done={[p.uid]:{rank,seq:p.seq,y,n}};
    patch.hands={[p.uid]:[]};
    if(p.source==="discard"){const pile=[...(s.discards[p.from]||[])];const i=pile.lastIndexOf(p.tile);if(i>=0)pile.splice(i,1);patch.discards={[p.from]:pile}}
    patch.last=null;
    if(!s.firstWinner)patch.firstWinner=p.uid;
    const nt=nextActive(s,p.uid,p.uid);
    if(!nt){patch.status="ended";patch.endReason="all"}else{patch.turn=nt;patch.stage="draw"}
    return logP(s,patch,`${y} 票合理，${n} 票不合理：${who} 胡牌成功，第 ${rank} 名`);
  }
  const hand=[...(s.hands[p.uid]||[])];const wall=[...s.wall];let extra="";
  if(wall.length){hand.push(wall.pop());patch.hands={[p.uid]:hand};patch.wall=wall;extra="罚摸一张，"}
  if(p.source==="self"||p.uid===s.turn){patch.turn=nextActive(s,p.uid)||p.uid;patch.stage="draw";patch.last=null}
  return logP(s,patch,`${y} 票合理，${n} 票不合理：${who} 胡牌失败，${extra}跳过本轮出牌`);
}
const ACTIONS={
  join:s=>joinPatch(s), stand:s=>leavePatch(s), start:s=>startPatch(s),
  draw:s=>drawPatch(s), chi:s=>chiPatch(s), discard:(s,a)=>discardPatch(s,Number(a.t)),
  hu:(s,a)=>huPatch(s,a.comp), vote:(s,a)=>votePatch(s,a.pid,a.v), force:(s,a)=>forcePatch(s,a.pid),
};

/* ---------- networking (PeerJS, host is authoritative) ---------- */
let peer=null,hostConn=null,STATE=null;
const conns=new Map();      // uid -> conn   (host side)
const lastSeen=new Map();   // uid -> ms     (host side)
let lastHostMsg=0,pingTimer=null,retryTimer=null;
const shareLink=code=>location.origin+location.pathname+"?room="+code;
function setUrl(code){try{history.replaceState(null,"",code?location.pathname+"?room="+code:location.pathname)}catch(e){}}

function onlineList(){const now=Date.now();const out=[S.me];for(const [u,t] of lastSeen)if(now-t<13000&&conns.has(u))out.push(u);return out}
function viewFor(uid){
  const v=clone(STATE);
  if(v.hands)for(const u in v.hands)if(u!==uid&&Array.isArray(v.hands[u]))v.hands[u]=v.hands[u].map(()=>-1);
  if(Array.isArray(v.wall))v.wall=v.wall.map(()=>0);
  v.online=onlineList();
  return v;
}
function broadcast(){
  lsSet("wzmj:hoststate:"+S.code,JSON.stringify(STATE));
  for(const [u,c] of conns){if(c.open){try{c.send({t:"state",s:viewFor(u)})}catch(e){}}}
  onState(viewFor(S.me));
}
function hostApply(uid,name,action,args){
  const fn=ACTIONS[action];if(!fn)return "未知操作";
  ME=uid;MENAME=name;
  try{
    const patch=fn(clone(STATE),args||{});
    if(patch){patch.updatedAt=Date.now();merge(STATE,patch);broadcast()}
    return null;
  }catch(e){return typeof e==="string"?e:"操作失败"}
  finally{ME=null;MENAME=""}
}
function newPeer(id){
  return new Peer(id,{config:ICE,debug:0});
}
function startHost(code,resume){
  S.code=code;S.isHost=true;S.phase="connecting";S.netMsg="正在开桌…";render();
  lsSet("wzmj:host:"+code,"1");setUrl(code);
  if(resume){try{STATE=JSON.parse(lsGet("wzmj:hoststate:"+code)||"null")}catch(e){STATE=null}}
  if(!STATE||STATE.host!==S.me){
    const now=Date.now();const name=S.name.trim()||"房主";
    STATE={name:name+"的牌桌",host:S.me,createdAt:now,updatedAt:now,status:"lobby",
      players:{[S.me]:{name,at:now}},seats:[],round:0,log:[`${name} 开了一桌`],pending:null,last:null};
  }
  const open=()=>{
    peer=newPeer(PREFIX+code);
    peer.on("open",()=>{S.phase="room";S.netMsg="";broadcast();render()});
    peer.on("connection",conn=>{
      conn.on("data",msg=>hostOnData(conn,msg));
      conn.on("close",()=>{if(conn.uid&&conns.get(conn.uid)===conn){conns.delete(conn.uid);broadcast()}});
      conn.on("error",()=>{});
    });
    peer.on("disconnected",()=>{if(!peer.destroyed)try{peer.reconnect()}catch(e){}});
    peer.on("error",err=>{
      if(err.type==="unavailable-id"){S.netMsg="房号还被上一次的连接占着，几秒后自动重试…";render();try{peer.destroy()}catch(e){}clearTimeout(retryTimer);retryTimer=setTimeout(open,4000)}
      else if(err.type==="network"||err.type==="server-error"||err.type==="socket-error"||err.type==="socket-closed"){S.netMsg="连不上联机服务器，正在重试…";render();try{peer.destroy()}catch(e){}clearTimeout(retryTimer);retryTimer=setTimeout(open,4000)}
      else if(err.type==="browser-incompatible"){S.netMsg="这个浏览器不支持联机，请换 Chrome、Safari 或微信外的浏览器";render()}
    });
  };
  open();
  clearInterval(pingTimer);
  let lastOnline="";
  pingTimer=setInterval(()=>{
    for(const c of conns.values())if(c.open)try{c.send({t:"ping"})}catch(e){}
    const on=onlineList().sort().join(",");if(on!==lastOnline){lastOnline=on;if(S.phase==="room")broadcast()}
  },4000);
}
function hostOnData(conn,msg){
  if(!msg||typeof msg!=="object")return;
  if(msg.t==="hello"&&typeof msg.uid==="string"&&msg.uid.length<40){
    const old=conns.get(msg.uid);if(old&&old!==conn)try{old.close()}catch(e){}
    conn.uid=msg.uid;conn.uname=String(msg.name||"").slice(0,12);conns.set(msg.uid,conn);lastSeen.set(msg.uid,Date.now());
    if(STATE.players&&STATE.players[msg.uid]&&conn.uname&&STATE.players[msg.uid].name!==conn.uname)STATE.players[msg.uid].name=conn.uname;
    broadcast();return;
  }
  if(!conn.uid)return;
  lastSeen.set(conn.uid,Date.now());
  if(msg.t==="act"){
    if(msg.name)conn.uname=String(msg.name).slice(0,12);
    const err=hostApply(conn.uid,conn.uname,msg.a,msg.args);
    if(err)try{conn.send({t:"err",msg:err})}catch(e){}
    else try{conn.send({t:"ok"})}catch(e){}
  }
}
function startClient(code){
  S.code=code;S.isHost=false;S.phase="connecting";S.netMsg="正在连接牌桌…";render();setUrl(code);
  const connect=()=>{
    if(!peer||peer.destroyed){
      peer=newPeer(undefined);
      peer.on("open",()=>dial());
      peer.on("disconnected",()=>{if(!peer.destroyed)try{peer.reconnect()}catch(e){}});
      peer.on("error",err=>{
        if(err.type==="peer-unavailable"){S.netMsg="找不到这一桌。房主可能关掉了页面，正在重试…";if(S.phase!=="room")S.phase="connecting";render();clearTimeout(retryTimer);retryTimer=setTimeout(dial,4000)}
        else if(err.type==="browser-incompatible"){S.netMsg="这个浏览器不支持联机，请换 Chrome 或 Safari 打开";render()}
        else{S.netMsg="网络不稳定，正在重试…";render();try{peer.destroy()}catch(e){}clearTimeout(retryTimer);retryTimer=setTimeout(connect,4000)}
      });
    }else dial();
  };
  const dial=()=>{
    if(!peer||peer.destroyed||!peer.open){connect();return}
    if(hostConn)try{hostConn.close()}catch(e){}
    const c=peer.connect(PREFIX+code,{reliable:true,serialization:"json"});hostConn=c;
    c.on("open",()=>{lastHostMsg=Date.now();c.send({t:"hello",uid:S.me,name:S.name.trim()})});
    c.on("data",msg=>{lastHostMsg=Date.now();
      if(!msg)return;
      if(msg.t==="state"){S.netMsg="";S.phase="room";onState(msg.s)}
      else if(msg.t==="err"){S.busy=false;toast(msg.msg);render()}
      else if(msg.t==="ok"){S.busy=false;render()}
    });
    c.on("close",()=>{if(hostConn===c){S.netMsg="和房主断开了，正在重连…";render();clearTimeout(retryTimer);retryTimer=setTimeout(dial,2500)}});
    c.on("error",()=>{});
  };
  connect();
  clearInterval(pingTimer);
  pingTimer=setInterval(()=>{
    if(hostConn&&hostConn.open){try{hostConn.send({t:"ping"})}catch(e){}}
    if(S.phase==="room"&&lastHostMsg&&Date.now()-lastHostMsg>14000){lastHostMsg=Date.now();S.netMsg="和房主失去联系，正在重连…";render();dial()}
  },4000);
}
function send(a,args){
  if(S.busy)return;
  if(S.isHost){const err=hostApply(S.me,S.name.trim(),a,args);if(err)toast(err);return}
  if(!hostConn||!hostConn.open){toast("还没连上房主，稍等一下");return}
  S.busy=true;render();
  hostConn.send({t:"act",a,args,name:S.name.trim()});
  setTimeout(()=>{if(S.busy){S.busy=false;render()}},6000);
}
function leaveRoom(){
  if(S.isHost&&STATE&&STATE.status!=="closed"&&!confirm("你是房主，离开后其他人会断线。确定离开？"))return;
  if(S.isHost&&STATE){STATE.status="closed";try{broadcast()}catch(e){}lsDel("wzmj:host:"+S.code);lsDel("wzmj:hoststate:"+S.code)}
  clearInterval(pingTimer);clearTimeout(retryTimer);
  setTimeout(()=>{try{peer&&peer.destroy()}catch(e){}peer=null},300);
  hostConn=null;conns.clear();lastSeen.clear();STATE=null;
  S.code=null;S.isHost=false;S.room=null;S.comp=null;S.banner=null;S.phase="home";setUrl(null);render();
}

/* ---------- local view state ---------- */
function onState(v){
  const prev=S.room;S.room=v;
  if(v.status==="closed"&&!S.isHost){toast("房主解散了这一桌");leaveRoom();return}
  if(!prev){try{S.order=JSON.parse(lsGet("wzmj:order:"+S.code)||"[]")}catch(e){S.order=[]}}
  syncOrder();
  const lr=v.lastResult;
  if(lr&&!S.seen.has(lr.id)){S.seen.add(lr.id);if(!S.firstSnap)S.banner=lr}
  S.firstSnap=false;
  if(S.comp&&v.pending)S.comp=null;
  if(S.comp&&S.comp.source==="discard"&&(!v.last||v.last.id!==S.comp.lastId))S.comp=null;
  if(S.comp&&S.comp.source==="self"&&!turnOf(v,S.me,"discard"))S.comp=null;
  S.busy=false;
  render();
}
function syncOrder(){
  const h=(S.room&&S.room.hands&&S.room.hands[S.me])||[];
  const before=new Set(S.order);
  S.order=S.order.filter(t=>h.includes(t));
  let fresh=null;h.forEach(t=>{if(!S.order.includes(t)){S.order.push(t);fresh=t}});
  if(fresh!=null&&before.size)S.newTile=fresh;
  if(!h.includes(S.newTile))S.newTile=null;
  if(S.sel!=null&&!h.includes(S.sel))S.sel=null;
  lsSet("wzmj:order:"+S.code,JSON.stringify(S.order));
}

/* ---------- rendering ---------- */
const tileBtn=(t,cls="",act="",v="")=>`<button class="tile ${cls}" ${act?`data-act="${act}" data-v="${v}"`:"tabindex='-1'"} aria-label="${TILES[t]}">${TILES[t]}</button>`;
const tileSpan=(t,cls="")=>`<span class="tile ${cls}" aria-label="${TILES[t]}">${TILES[t]}</span>`;
const sentenceHTML=(seq,cls="md")=>`<div class="sentence">${seq.map(x=>x<0?`<span class="brk">，</span>`:tileSpan(x,cls)).join("")}</div>`;
const RULES=`<details class="rules"><summary>怎么玩</summary><ol>
<li>2 到 6 人，144 张字牌，每字一张。开局掷骰子，按点数顺时针落座，点数最大的坐庄。</li>
<li>从庄家开始每人 13 张。轮到你时先摸一张（或者吃掉上家刚打出的牌），再打出一张。</li>
<li>手里的牌能组成一段喜欢又说得通的文字时就可以胡：轮到你出牌时自摸胡，或者用任何人刚打出的那张胡。可以自由断句，不限文风和主题。</li>
<li>胡牌时把全部手牌排成句子，由其他玩家投票。觉得合理的多于不合理的就胡牌成功；否则失败，罚摸一张并跳过本轮出牌。</li>
<li>每局第一个胡牌的人下一局坐庄。所有人都胡了，或者牌堆摸完，本局结束。</li></ol></details>`;

function render(){
  const a=document.activeElement;const keep=a&&a.id?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null;
  let h="";
  if(S.phase==="home")h=homeHTML();
  else if(S.phase==="connecting")h=`<div class="wrap">${heroHTML()}<div class="card"><p style="margin:0 0 12px">${esc(S.netMsg||"正在连接…")}</p><button class="btn ghost-dark small" data-act="leave">返回</button></div></div>`;
  else if(S.phase==="room")h=roomHTML();
  $app.innerHTML=h+overlayHTML();
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}
function heroHTML(){
  return `<header class="hero"><div class="hero-title">${[..."文字麻将"].map(c=>`<span class="tile">${c}</span>`).join("")}</div>
  <p>摸牌、吃牌、凑句子。胡不胡，桌上的人说了算。</p></header>`;
}
function homeHTML(){
  const pendingCode=new URLSearchParams(location.search).get("room");
  return `<div class="wrap">${heroHTML()}
  <div class="card"><label for="nameInput" style="font-weight:600">你的昵称</label>
    <input id="nameInput" class="text" style="margin-top:8px" maxlength="12" value="${esc(S.name)}" placeholder="例如：白色失明">
    ${pendingCode?`<div class="row" style="margin-top:12px"><button class="btn primary" data-act="joinCode" data-v="${esc(pendingCode)}">加入牌桌 ${esc(pendingCode)}</button></div>`
    :`<div class="row" style="margin-top:12px"><button class="btn primary" data-act="create">开一桌</button></div>
    <div class="row" style="margin-top:14px;flex-wrap:nowrap"><input id="codeInput" class="text" maxlength="8" placeholder="朋友给的房号" autocapitalize="off" autocomplete="off">
    <button class="btn" data-act="joinInput" style="white-space:nowrap">加入</button></div>`}
  </div>
  <p class="muted" style="font-size:13px;margin-top:12px">开一桌后把链接发给朋友，点开就能入座，不用注册。</p>
  ${RULES}</div>`;
}
function roomHTML(){
  const s=S.room;
  if(!s)return `<div class="wrap"><p class="muted">正在入座…</p></div>`;
  const top=`<div class="topbar"><button class="btn ghost small" data-act="leave">‹ 离开</button>
    <div class="grow"><h1>${esc(s.name)}</h1></div>
    ${s.status==="playing"?`<span class="muted" style="font-size:13px;white-space:nowrap">牌堆 ${s.wall.length}</span>`:""}</div>

function lobbyHTML(s){
  const ps=plist(s);const mine=s.players&&s.players[S.me];const host=s.host===S.me;const on=new Set(s.online||[]);
  return `<div class="status">等人入座（${ps.length}/6）</div>
  <div class="share"><div class="muted" style="font-size:13px;margin-bottom:6px">房号 <b style="color:var(--felt-ink);letter-spacing:.08em">${esc(S.code)}</b>，把链接发给朋友：</div>
    <div class="row" style="flex-wrap:nowrap"><input id="linkInput" class="text" readonly value="${esc(shareLink(S.code))}"><button class="btn primary" data-act="share" style="white-space:nowrap">分享</button></div></div>
  <div class="rooms">${ps.map(p=>`<div class="room-item"><div class="grow"><b>${esc(p.name)}${p.id===s.host?`<span class="badge gold">房主</span>`:""}${p.id===S.me?`<span class="muted" style="font-weight:400">（你）</span>`:on.has(p.id)?"":`<span class="muted" style="font-weight:400">（离线）</span>`}</b></div></div>`).join("")}</div>
  <div class="row" style="margin-top:16px">
  ${mine?"":`<input id="nameInput" class="text" style="max-width:220px" maxlength="12" value="${esc(S.name)}" placeholder="你的昵称"><button class="btn primary" data-act="sit" ${S.busy?"disabled":""}>入座</button>`}
  ${host?`<button class="btn primary" data-act="start" ${S.busy||ps.length<2?"disabled":""}>掷骰子开局</button>`:""}
  ${mine&&!host?`<button class="btn ghost" data-act="stand" ${S.busy?"disabled":""}>离座</button>`:""}
  </div>
  <p class="muted" style="margin-top:14px">${host?"人齐了由你开局。你是房主，整局都要开着这个页面，别锁屏太久。":"等房主开局。"}</p>`;
}
function statusText(s){
  const p=s.pending;
  if(p)return `${esc(nm(s,p.uid))} 宣告胡牌，大家投票中`;
  const me=s.turn===S.me;const who=esc(nm(s,s.turn));
  if(s.stage==="draw")return me?"轮到你摸牌":`等 ${who} 摸牌`;
  return me?"轮到你出牌":`等 ${who} 出牌`;
}
function tableHTML(s){
  const seats=s.seats;const inGame=seats.includes(S.me);const done=s.done||{};const on=new Set(s.online||[]);
  const seatHTML=seats.map(u=>{const d=done[u];const cnt=(s.hands[u]||[]).length;
    return `<div class="seat ${u===s.turn&&!d?"turn":""}"><div class="nm">${esc(nm(s,u))}${u===S.me?"（你）":""}</div>
    <div class="meta muted">${u===s.dealer?`<span class="badge gold" style="margin:0 4px 0 0">庄</span>`:""}${d?`<span class="badge" style="margin:0">已胡 第${d.rank}名</span>`:`${cnt} 张`}${on.has(u)?"":` <span class="off">离线</span>`}</div></div>`}).join("");
  const piles=seats.map(u=>{const pile=s.discards[u]||[];
    return `<div class="pile"><div class="who">${esc(nm(s,u))}</div><div class="tiles">${pile.length?pile.map((t,i)=>tileSpan(t,"sm"+(s.last&&s.last.from===u&&i===pile.length-1?" hot":""))).join(""):`<span class="muted" style="font-size:13px;padding-top:4px">还没出牌</span>`}</div></div>`}).join("");
  const wins=seats.filter(u=>done[u]).sort((a,b)=>done[a].rank-done[b].rank).map(u=>`<div class="win"><div class="head">第 ${done[u].rank} 名 ${esc(nm(s,u))}（${done[u].y} 票合理，${done[u].n} 票不合理）</div>${sentenceHTML(done[u].seq,"md")}</div>`).join("");
  const log=(s.log||[]).slice(-5).map(l=>`<div>${esc(l)}</div>`).join("");
  return `<div class="seats">${seatHTML}</div>
  <div class="status">${statusText(s)}</div>
  ${s.last&&!s.pending?`<div class="row" style="margin:4px 0 6px"><span class="muted" style="font-size:13px">${esc(nm(s,s.last.from))} 刚打出</span>${tileSpan(s.last.tile,"md hot")}</div>`:""}
  <div class="pile-list">${piles}</div>
  ${wins?`<div class="wins">${wins}</div>`:""}
  <div class="log">${log}</div>
  ${inGame?dockHTML(s):`<p class="muted" style="margin-top:18px">你在围观这一局。</p>`}`;
}
function dockHTML(s){
  const done=s.done&&s.done[S.me];
  if(done)return `<div class="dock"><div class="hint">你已经胡了，第 ${done.rank} 名。其他人胡牌时记得投票。</div></div>`;
  const hand=S.order;const acts=[];const b=S.busy||!!s.pending;let hint="";
  const canClaim=!s.pending&&s.stage==="draw"&&s.last&&s.last.from!==S.me;
  if(turnOf(s,S.me,"draw")){
    hint="摸一张牌，或者吃掉刚打出的那张。";
    acts.push(`<button class="btn primary" data-act="draw" ${b?"disabled":""}>摸牌</button>`);
    if(s.last&&s.last.from!==S.me)acts.push(`<button class="btn" data-act="chi" ${b?"disabled":""}>吃「${TILES[s.last.tile]}」</button>`);
  }else if(turnOf(s,S.me,"discard")){
    hint=S.sel==null?"点一张牌选中，再打出；能凑成句子就胡。":"选中了「"+TILES[S.sel]+"」，可以打出或左右挪动整理。";
    acts.push(`<button class="btn primary" data-act="discard" ${b||S.sel==null?"disabled":""}>打出${S.sel!=null?"「"+TILES[S.sel]+"」":""}</button>`);
    acts.push(`<button class="btn seal" data-act="huSelf" ${b?"disabled":""}>胡牌</button>`);
  }else hint=s.pending?"投票结束后继续。":"没轮到你。点牌可以选中，再左右挪动整理手牌。";
  if(canClaim)acts.push(`<button class="btn seal" data-act="huDiscard" ${b?"disabled":""}>用「${TILES[s.last.tile]}」胡</button>`);
  if(S.sel!=null)acts.push(`<button class="btn ghost small" data-act="moveL">‹ 左移</button><button class="btn ghost small" data-act="moveR">右移 ›</button>`);
  return `<div class="dock"><div class="hint">${hint}</div>${acts.length?`<div class="actions">${acts.join("")}</div>`:""}
    <div class="tiles hand">${hand.map(t=>tileBtn(t,"hand"+(S.sel===t?" sel":"")+(S.newTile===t?" new":""),"sel",t)).join("")}</div></div>`;
}
function endedHTML(s){
  const done=s.done||{};const seats=s.seats||[];
  const winners=seats.filter(u=>done[u]).sort((a,b)=>done[a].rank-done[b].rank);
  const rest=seats.filter(u=>!done[u]);const host=s.host===S.me;
  return `<div class="status">${s.endReason==="wall"?"牌堆摸完，本局结束":"所有人都胡了"}</div>
  <div class="rank">${winners.map(u=>`<div class="win"><div class="head">第 ${done[u].rank} 名 ${esc(nm(s,u))}</div>${sentenceHTML(done[u].seq,"md")}</div>`).join("")}
  ${rest.length?`<div class="win"><div class="head">没胡：${esc(rest.map(u=>nm(s,u)).join("、"))}</div></div>`:""}</div>
  <div class="row" style="margin-top:18px">${host?`<button class="btn primary" data-act="start" ${S.busy?"disabled":""}>再来一局</button>`:`<span class="muted">等房主开下一局。</span>`}</div>
  ${s.firstWinner?`<p class="muted">下一局由 ${esc(nm(s,s.firstWinner))} 坐庄。</p>`:""}`;
}
function overlayHTML(){
  const s=S.room;if(S.phase!=="room"||!s)return "";
  if(S.banner){const r=S.banner;const who=esc(nm(s,r.uid));
    return `<div class="overlay" role="dialog" aria-modal="true"><div class="sheet center">
    ${r.ok?`<div class="stamp">胡</div><h2>${who} 胡了</h2>`:`<div class="stamp fail">不通过</div><h2>${who} 没胡成</h2>`}
    <p class="muted" style="margin:0 0 12px">${r.y} 票合理，${r.n} 票不合理${r.ok?"":"。罚摸一张，跳过本轮出牌"}</p>
    <div style="display:flex;justify-content:center">${sentenceHTML(r.seq,"lg")}</div>
    <div style="margin-top:18px"><button class="btn primary" data-act="bannerClose">继续</button></div></div></div>`}
  if(S.comp)return composerHTML();
  if(s.status==="playing"&&s.pending)return voteHTML(s);
  return "";
}
function composerHTML(){
  const c=S.comp;const used=new Set(c.seq.filter(x=>x>=0));const rest=c.tiles.filter(t=>!used.has(t));
  return `<div class="overlay" role="dialog" aria-modal="true" aria-label="排句子"><div class="sheet">
  <h2>排句子</h2><p class="muted" style="margin:0">按顺序点牌组句，用上全部 ${c.tiles.length} 张。「断句」加一个停顿，点句子里的牌放回去。</p>
  <div class="compose-area ${c.seq.length?"":"empty"}">${c.seq.length?`<div class="sentence">${c.seq.map((x,i)=>x<0?`<button class="brk" style="background:none;border:0;padding:0" data-act="compDel" data-v="${i}" aria-label="删除断句">，</button>`:tileBtn(x,"lg","compDel",i)).join("")}</div>`:"点下面的牌开始排"}</div>
  <div class="row" style="margin-bottom:12px"><button class="btn small" data-act="compBreak" ${c.seq.length?"":"disabled"}>断句</button>
  <button class="btn small" data-act="compUndo" ${c.seq.length?"":"disabled"}>撤回</button><button class="btn small" data-act="compClear" ${c.seq.length?"":"disabled"}>清空</button></div>
  <div class="tiles">${rest.map(t=>tileBtn(t,"hand"+(c.source==="discard"&&t===c.claimed?" hot":""),"compAdd",t)).join("")}</div>
  <div class="row" style="margin-top:18px"><button class="btn seal" data-act="compSubmit" ${rest.length||S.busy?"disabled":""}>请大家投票</button>
  <button class="btn ghost" data-act="compCancel">取消</button></div></div></div>`;
}
function voteHTML(s){
  const p=s.pending;const voters=s.seats.filter(u=>u!==p.uid);const votes=p.votes||{};
  const cast=voters.filter(u=>votes[u]).length;const mine=votes[S.me];
  const iVote=voters.includes(S.me);const who=esc(nm(s,p.uid));
  let body;
  if(p.uid===S.me)body=`<p class="muted">等大家投票（${cast}/${voters.length}）</p>`;
  else if(iVote&&!mine)body=`<p class="muted" style="margin:0 0 12px">这句话说得通吗？</p><div class="row"><button class="btn primary" data-act="vote" data-v="y" ${S.busy?"disabled":""}>合理</button><button class="btn" data-act="vote" data-v="n" ${S.busy?"disabled":""}>不合理</button></div>`;
  else body=`<p class="muted">${mine?`你投了「${mine==="y"?"合理":"不合理"}」，`:""}已投 ${cast}/${voters.length}</p>`;
  const force=s.host===S.me&&cast<voters.length?`<button class="btn ghost small" data-act="force" style="margin-top:12px">有人掉线？按已投的票结算</button>`:"";
  return `<div class="overlay" role="dialog" aria-modal="true"><div class="sheet">
  <h2>${who} 要胡</h2><p class="muted" style="margin:0">${p.source==="discard"?`用 ${esc(nm(s,p.from))} 打出的「${TILES[p.tile]}」`:"自摸"}，排出了这句：</p>
  <div class="compose-area">${sentenceHTML(p.seq,"lg")}</div>${body}${force}</div></div>`;
}

/* ---------- events ---------- */
function normCode(v){return String(v||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,8)}
async function share(){
  const url=shareLink(S.code);const text=`来玩文字麻将，房号 ${S.code}：${url}`;
  if(navigator.share){try{await navigator.share({title:"文字麻将",text,url});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(text);toast("链接已复制，发给朋友吧");return}catch(e){}
  const el=document.getElementById("linkInput");if(el){el.focus();el.select()}toast("长按链接手动复制");
}
const ACT={
  create:()=>{if(!S.name.trim())return toast("先起一个昵称");startHost(rid(5,"abcdefghjkmnpqrstuvwxyz23456789"),false)},
  joinCode:v=>{if(!S.name.trim())return toast("先起一个昵称");const c=normCode(v);if(lsGet("wzmj:host:"+c))startHost(c,true);else startClient(c)},
  joinInput:()=>{const c=normCode((document.getElementById("codeInput")||{}).value);if(!c)return toast("输入房号");ACT.joinCode(c)},
  leave:()=>leaveRoom(),
  share:()=>share(),
  sit:()=>{if(!S.name.trim())return toast("先起一个昵称");send("join")},
  stand:()=>send("stand"),
  start:()=>send("start"),
  draw:()=>send("draw"),
  chi:()=>send("chi"),
  sel:v=>{const t=+v;S.sel=S.sel===t?null:t;render()},
  discard:()=>{if(S.sel!=null)send("discard",{t:S.sel})},
  moveL:()=>moveSel(-1),moveR:()=>moveSel(1),
  huSelf:()=>{S.comp={source:"self",tiles:[...S.order],seq:[]};render()},
  huDiscard:()=>{const s=S.room;if(!s.last)return;S.comp={source:"discard",tiles:[...S.order,s.last.tile],claimed:s.last.tile,lastId:s.last.id,seq:[]};render()},
  compAdd:v=>{S.comp.seq.push(+v);render()},
  compDel:v=>{S.comp.seq.splice(+v,1);render()},
  compBreak:()=>{const q=S.comp.seq;if(q.length&&q[q.length-1]>=0)q.push(-1);render()},
  compUndo:()=>{S.comp.seq.pop();render()},
  compClear:()=>{S.comp.seq=[];render()},
  compCancel:()=>{S.comp=null;render()},
  compSubmit:()=>{const c=S.comp;send("hu",{comp:{source:c.source,seq:c.seq,lastId:c.lastId}})},
  vote:v=>{const p=S.room.pending;if(p)send("vote",{pid:p.id,v})},
  force:()=>{const p=S.room.pending;if(p)send("force",{pid:p.id})},
  bannerClose:()=>{S.banner=null;render()},
};
function moveSel(d){const i=S.order.indexOf(S.sel);const j=i+d;if(i<0||j<0||j>=S.order.length)return;
  [S.order[i],S.order[j]]=[S.order[j],S.order[i]];lsSet("wzmj:order:"+S.code,JSON.stringify(S.order));render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v,b)});
document.addEventListener("input",e=>{if(e.target.id==="nameInput"){S.name=e.target.value;lsSet("wzmj:name",S.name)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="codeInput")ACT.joinInput()});
window.addEventListener("beforeunload",e=>{if(S.isHost&&STATE&&STATE.status==="playing"){e.preventDefault();e.returnValue=""}});

/* ---------- boot ---------- */
(function boot(){
  if(typeof Peer==="undefined"){$app.innerHTML=`<div class="wrap"><div class="card">联机组件没有加载成功，请刷新页面。</div></div>`;return}
  const code=normCode(new URLSearchParams(location.search).get("room"));
  if(code&&lsGet("wzmj:host:"+code)&&lsGet("wzmj:hoststate:"+code)){startHost(code,true);return}
  if(code&&S.name.trim()){startClient(code);return}
  render();
})();

</script>
</body>
</html>
